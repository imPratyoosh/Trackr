name: Tracker

on:
  schedule:
    - cron: '0 * * * *'   # Runs at minute 0 past every hour
  workflow_dispatch:      # Allows manual triggering from the Actions tab


permissions:
  contents: write         # Required to create releases and push state.json

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tracker.py

      - name: Commit and Push State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Only commit and push if state.json has changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update release state" && git push)
          
